name: Remove completed UICL transfer branch
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/uicl-import.yml']
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'Payhon/uicl'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove only the unchanged temporary recovery branch
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          assert os.environ['GITHUB_REPOSITORY'] == 'Payhon/uicl'
          root = 'https://api.github.com/repos/Payhon/uicl'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          lookup = root + '/git/ref/heads/uicl-import-recovery'
          try:
              with urllib.request.urlopen(urllib.request.Request(lookup, headers=headers), timeout=30) as response:
                  ref = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print('Temporary branch is already absent.')
                  raise SystemExit(0)
              raise
          assert ref['ref'] == 'refs/heads/uicl-import-recovery'
          assert ref['object']['sha'] == 'a03d8e3d5cdcc6641376782b84023ab68dc5ee47', 'Branch changed; preserving it.'
          request = urllib.request.Request(root + '/git/refs/heads/uicl-import-recovery', headers=headers, method='DELETE')
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status == 204
          print('Removed the temporary recovery branch; main and imported sources are unchanged.')
          PY
